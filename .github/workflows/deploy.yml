name: Deploy to GitHub Pages

# v9.6 (2026-02) — auto-deploy CRA build to gh-pages branch + post-build
# patches that fix two production issues at once:
#   1. Vercel "react-scripts: command not found" build failures, because
#      Vercel was trying to RE-BUILD the gh-pages branch (which already
#      contains the built static output, no source). Solved by writing
#      a vercel.json with buildCommand:null into build/, so Vercel
#      serves the gh-pages files as-is without rebuilding.
#   2. iPhone Safari "Add to Home Screen" was always saving the icon
#      with the title "EduHub Studio" instead of "Author Studio" when
#      the user was on /studio. Root cause: iOS Safari reads
#      apple-mobile-web-app-title from the RAW HTML stream, not from
#      the live (JS-mutated) DOM — so the v9.5 runtime patcher worked
#      in DevTools but iOS ignored it. Solved by generating a static
#      build/studio.html with "Author Studio" baked into the meta tags
#      at build time, plus a Vercel rewrite that maps /studio,
#      /studio/, and /studio/* to /studio.html.
#
# Non-interference guarantees (verified before this workflow committed):
#   • src/ is never modified — no React, business logic, or backend
#     surface is touched.
#   • public/ is never modified — sw.js, manifest.json, icons, splash
#     images all kept byte-identical to what `yarn build` produces.
#   • All API calls already go to a DIFFERENT origin (the eduhub-backend
#     deployment, via REACT_APP_BACKEND_URL). The rewrites added here
#     only affect static HTML for paths starting with /studio. They
#     cannot intercept /api/* or any other backend route.
#   • Service worker scope ('/'), VAPID keys, push subscriptions, and
#     "ring bell" opt-in state are 100% unaffected — sw.js bytes are
#     unchanged, so existing PWA installs see no SW lifecycle event.
#   • All other SPA routes (/, /library, /dashboard, /portal, /game,
#     /reader, …) keep loading the original /index.html via the
#     explicit catch-all rewrite — same as before.
#   • Build steps unchanged. Post-build steps are PURE ADDITIONS that
#     write two NEW files and never modify what `yarn build` produced.
#   • Defensive checks: if the expected meta strings are missing from
#     the freshly-built build/index.html (e.g., a future upstream HTML
#     change), the workflow fails loudly BEFORE publishing — gh-pages
#     is not overwritten with a broken deploy.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel duplicate runs if you push twice quickly
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the gh-pages branch

    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install deps (frozen lockfile)
        run: yarn install --frozen-lockfile

      - name: Clear CRA cache
        run: rm -rf node_modules/.cache

      - name: Verify treasury secret is set
        run: |
          if [ -z "$REACT_APP_TREASURY_PASSWORD" ]; then
            echo "ERROR: REACT_APP_TREASURY_PASSWORD is empty — check GitHub secret"
            exit 1
          else
            echo "OK: REACT_APP_TREASURY_PASSWORD is set (length: ${#REACT_APP_TREASURY_PASSWORD})"
          fi
        env:
          REACT_APP_TREASURY_PASSWORD: ${{ secrets.REACT_APP_TREASURY_PASSWORD }}

      - name: Build production bundle
        run: yarn build
        env:
          CI: false           # CRA treats warnings as errors by default in CI; relax it
          REACT_APP_TREASURY_ID: stu092
          REACT_APP_TREASURY_PASSWORD: ${{ secrets.REACT_APP_TREASURY_PASSWORD }}

      # ────────────────────────────────────────────────────────────────
      #  v9.6 post-build patches (additive only — never modify
      #  build/index.html, build/sw.js, build/manifest.json, or any
      #  React bundle in build/static/).
      # ────────────────────────────────────────────────────────────────

      - name: "v9.6.1 · Generate build/studio.html (byte-identical shell copy)"
        run: |
          python3 - <<'PY'
          import sys, hashlib, shutil, pathlib
          src_path = pathlib.Path('build/index.html')
          dst_path = pathlib.Path('build/studio.html')
          if not src_path.exists():
              sys.exit('FATAL: build/index.html not found — did `yarn build` succeed?')

          src = src_path.read_text(encoding='utf-8')

          # v9.6.1 — public/index.html now resolves the "Author Studio" vs
          # "EduHub Studio" identity (title, apple-mobile-web-app-title,
          # application-name, manifest link) ENTIRELY client-side, at HTML
          # PARSE time, via two inline <script> blocks keyed off
          # window.location.pathname (see "iOS Add to Home Screen parse-time
          # identity fix" in public/index.html). That means studio.html no
          # longer needs its own statically-patched meta tags — the SAME
          # file, served at the /studio URL, self-identifies correctly,
          # because the script reads the URL the browser is actually on, not
          # anything baked into the file it happened to be served from.
          # studio.html only needs to exist as a distinct file because
          # static hosting (GitHub Pages / this gh-pages branch) has no
          # server-side routing — Vercel's generated rewrite below maps
          # /studio -> studio.html at the edge.
          #
          # The v9.6 approach (regex-patching static "EduHub Studio" meta
          # strings) broke the moment index.html's own fix landed, because
          # those strings no longer exist as static text — only as a JS
          # string literal the inline script writes at parse time. Trying to
          # string-replace a value that is only ever computed at runtime is
          # not fixable by patching harder; the correct fix is to stop
          # patching and let the shared script do its job for both routes.
          #
          # Safety check preserved: refuse to publish if the client-side
          # shell-identity script itself is missing (e.g. a future upstream
          # rewrite of public/index.html removes/renames it) — fail loudly
          # BEFORE publishing rather than shipping a shell with no /studio
          # identity logic at all.
          REQUIRED_MARKERS = [
              '__STUDIO_SHELL__',
              'apple-mobile-web-app-title',
              'id="appManifest"',
          ]
          missing = [m for m in REQUIRED_MARKERS if m not in src]
          if missing:
              print('FATAL: expected markers not found in build/index.html:')
              for m in missing:
                  print('  -', m)
              sys.exit(
                  'Refusing to publish studio.html: build/index.html no '
                  'longer contains the client-side shell-identity script '
                  'this relies on. Inspect public/index.html for upstream '
                  'changes and update this workflow (and REQUIRED_MARKERS) '
                  'accordingly.'
              )

          shutil.copyfile(src_path, dst_path)

          src_md5 = hashlib.md5(src.encode()).hexdigest()
          print(f'  build/index.html  md5={src_md5} bytes={len(src)}')
          print(f'  build/studio.html byte-identical copy written (same md5)')
          PY

      - name: "v9.6 · Generate build/vercel.json (skip Vercel build + route /studio)"
        run: |
          cat > build/vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "framework": null,
            "buildCommand": null,
            "installCommand": null,
            "outputDirectory": ".",
            "trailingSlash": false,
            "cleanUrls": false,
            "rewrites": [
              { "source": "/studio",        "destination": "/studio.html" },
              { "source": "/studio/",       "destination": "/studio.html" },
              { "source": "/studio/(.*)",   "destination": "/studio.html" },
              { "source": "/((?!api/|static/|icons/|splash/|books/|sw\\.js|manifest\\.json|offline\\.html|asset-manifest\\.json|robots\\.txt|favicon\\.ico|apple-touch-icon.*|.*\\.(?:png|jpg|jpeg|webp|svg|gif|ico|js|css|map|json|txt|xml|woff2?|ttf|otf)).*)", "destination": "/index.html" }
            ],
            "headers": [
              {
                "source": "/sw.js",
                "headers": [
                  { "key": "Cache-Control", "value": "no-cache, must-revalidate" },
                  { "key": "Service-Worker-Allowed", "value": "/" }
                ]
              },
              {
                "source": "/index.html",
                "headers": [
                  { "key": "Cache-Control", "value": "no-cache, must-revalidate" }
                ]
              },
              {
                "source": "/studio.html",
                "headers": [
                  { "key": "Cache-Control", "value": "no-cache, must-revalidate" }
                ]
              },
              {
                "source": "/manifest.json",
                "headers": [
                  { "key": "Cache-Control", "value": "no-cache, must-revalidate" },
                  { "key": "Content-Type", "value": "application/manifest+json; charset=utf-8" }
                ]
              },
              {
                "source": "/static/(.*)",
                "headers": [
                  { "key": "Cache-Control", "value": "public, max-age=31536000, immutable" }
                ]
              }
            ]
          }
          JSON
          # Validate JSON before publishing — refuse to ship malformed config.
          python3 -c "import json,sys; json.loads(open('build/vercel.json').read()); print('build/vercel.json is valid JSON,', len(open('build/vercel.json').read()), 'bytes')"

      - name: "v9.6.1 · Sanity check before publish (no source files were touched)"
        run: |
          set -e
          # Verify the build/ folder we're about to publish has the
          # expected new files plus all the original CRA outputs.
          for f in build/index.html build/studio.html build/vercel.json build/sw.js build/manifest.json build/asset-manifest.json; do
            if [ ! -f "$f" ]; then
              echo "FATAL: missing $f"
              exit 1
            fi
          done
          # v9.6.1 — studio.html must be a byte-identical copy of
          # index.html. The client-side shell-identity script in
          # public/index.html (keyed off window.location.pathname) is what
          # makes the /studio route self-identify as "Author Studio" — not
          # anything baked into the file at build time. Any divergence
          # between the two means something patched one and not the other;
          # refuse to publish rather than ship an inconsistent pair.
          if ! cmp -s build/index.html build/studio.html; then
            echo "FATAL: build/studio.html is not byte-identical to build/index.html — refusing to publish"
            diff build/index.html build/studio.html | head -20
            exit 1
          fi
          echo "OK · build/studio.html is a byte-identical copy of build/index.html"
          # Print final manifest of files going to gh-pages (top-level)
          echo "──── files about to publish to gh-pages ────"
          ls -la build/ | grep -v '^total'

      - name: Deploy build/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          force_orphan: true   # keep gh-pages history shallow — no stale build artifacts
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
